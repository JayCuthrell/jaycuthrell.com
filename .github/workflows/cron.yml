name: cron

on:
  push:
    branches:
      - gh-pages
  schedule:
    - cron: "35 3 * * *"

# Ensure the GitHub token has permission to push the updated markdown
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Opt into Node.js 24 to silence the deprecation warning
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 🍽️ Get working copy
        uses: actions/checkout@v4
        with:
          fetch-depth: 1                                                                 
      
      - name: 🐍 Set up Python 3.12                               
        uses: actions/setup-python@v5                             
        with:                                 
          python-version: '3.12' 
                                                            
      - name: 💿 Install requirements                           
        run: pip install feedparser pytz 
        
      - name: 🍳 Update newsletter.md
        run: |
          cd ${GITHUB_WORKSPACE}/src/
          python newsletter.py
      - name: 🎙️ Update podcast.md
        run: |
          cd ${GITHUB_WORKSPACE}/src/
          python podcast.py
      - name: 🏅 Update badges.md
        run: |
          cd ${GITHUB_WORKSPACE}/src/
          python badges.py
    
      - name: 🚀 Deploy
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          # Run from the root directory to avoid path errors
          git add _pages/newsletter.md _pages/podcast.md _pages/badges.md
          # Only commit and push if there are actually changes
          git diff-index --quiet HEAD || git commit -m "feat(auto generate): Updated newsletter content"
          git push origin gh-pages