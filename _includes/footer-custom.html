<!-- Table of Contents Relocation Script -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Locate the sidebar column and the generated TOC list
    var sidebar = document.querySelector('.page-sidebar');
    var toc = document.getElementById('markdown-toc') || document.getElementById('entry-table-of-contents');
    
    // If both exist, appendChild moves the TOC directly below the author profile block
    if (sidebar && toc) {
      sidebar.appendChild(toc);
    }
  });
</script>
