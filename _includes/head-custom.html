<!-- Custom CSS: Cleanly stack and left-justify the TOC in the sidebar -->
<style>
  @media screen and (min-width: 62em) {
    /* 1. Force natural vertical stacking and remove absolute positioning overlaps */
    .page-sidebar #markdown-toc,
    .page-sidebar #entry-table-of-contents {
      position: static !important; /* Lets the browser stack it below your profile */
      margin-top: 2.5rem !important; /* Adds breathing room below the date/read time */
      margin-left: 0 !important;
      padding-left: 0 !important;
      width: 100% !important;
      text-align: left !important; /* Forces strict left justification */
      list-style: none !important;
    }

    /* 2. Style the individual list items for clean readability */
    .page-sidebar #markdown-toc li,
    .page-sidebar #entry-table-of-contents li {
      text-align: left !important;
      list-style-type: none !important;
      margin-bottom: 0.6em !important;
      line-height: 1.4 !important;
      padding-left: 0 !important;
    }

    /* 3. Ensure links fill the space neatly and align left */
    .page-sidebar #markdown-toc a,
    .page-sidebar #entry-table-of-contents a {
      display: block !important;
      text-align: left !important;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding-bottom: 0.3em;
    }
    
    /* 4. Indent nested sub-lists slightly for visual hierarchy */
    .page-sidebar #markdown-toc ul,
    .page-sidebar #entry-table-of-contents ul {
      margin-top: 0.4em !important;
      padding-left: 1rem !important;
    }
  }
</style>

<!-- Custom CSS: Globally hide the Previous/Next pagination navigation -->
<style>
  /* Target the page-pagination navigation container and remove it from view */
  .layout--page .page-pagination,
  .layout--post .page-pagination,
  .page-pagination {
    display: none !important; /* Forces the browser to completely hide the element and free up the space */
  }
</style>
